   <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    /* HEADER */
    .rtve-header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
      margin-bottom: 20px;
    }

    .rtve-header h1 {
      color: #FF6F00;
      font-size: 22px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    nav a:hover {
      color: #FF6F00;
    }

    /* CAJA */
    .game-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .game-box h2 {
      margin-bottom: 20px;
    }

    /* CONTENEDOR GENIALLY */
    .genially-wrapper {
      position: relative;
      width: 100%;
      min-height: 500px;
      border-radius: 10px;
      overflow: hidden;
      background: #eee;
    }

    /* BOTÓN VOLVER */
    .back-btn {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: white;
      background: #FF6F00;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 14px;
    }

    .back-btn:hover {
      opacity: 0.9;
    }

  </style>
</head>
